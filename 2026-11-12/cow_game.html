<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cow & Flower Meadow</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#173b2d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#dff5ff,#edf9d6);padding:14px}.game{width:min(940px,100%);background:white;border:3px solid #204c33;border-radius:25px;padding:14px;box-shadow:0 14px 0 #a2c995,0 25px 40px #335c4b33}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px 8px 12px}h1{font-size:clamp(22px,4vw,34px);margin:0;color:#276c46}header .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:18px;font-weight:800}.stat{background:#eaf7db;border:2px solid #b1d1a5;border-radius:13px;padding:6px 12px}canvas{display:block;width:100%;height:auto;aspect-ratio: 16/9;background:#b9e8ff;border:3px solid #397a51;border-radius:14px;image-rendering:pixelated;touch-action:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 4px 3px}.instructions{font-size:15px;line-height:1.5}button{font:inherit;font-weight:800;border:2px solid #26593f;border-radius:12px;background:#ffe075;color:#263d28;padding:9px 15px;cursor:pointer;box-shadow:0 4px 0 #a78324}button:active{transform:translateY(3px);box-shadow:0 1px 0 #a78324}.controls{display:flex;align-items:center;gap:9px;touch-action:none}.controls button{font-size:24px;min-width:58px;min-height:49px;background:#d4f2cb;user-select:none;-webkit-user-select:none}.controls .updown{display:flex;flex-direction:column;gap:5px}.controls .updown button{min-height:38px}.message{font-weight:700;color:#357a4a}footer{text-align:center;color:#5d7f66;font-size:12px;margin-top:8px}@media(max-width:600px){.controls{width:100%;justify-content:center}.bottom{justify-content:center}.instructions{text-align:center}header{justify-content:center}}
</style></head><body><main class="game"><header><h1>🐮 Cow & Flower Meadow</h1><div class="stats"><span class="stat">🌼 <span id="score">0</span></span><span class="stat">⏱️ <span id="time">45</span>s</span><span class="stat">🏆 <span id="best">0</span></span></div></header>
<canvas id="field" width="960" height="540" aria-label="Cow game field"></canvas><div class="bottom"><div class="instructions"><strong>Collect flowers!</strong><br>Move with <strong>← ↑ ↓ →</strong> or <strong>W A S D</strong>.<br><span class="message" id="message">Grab as many as you can in 45 seconds.</span></div><div class="controls" aria-label="Touch controls"><button data-dir="left" aria-label="Move left">◀</button><div class="updown"><button data-dir="up" aria-label="Move up">▲</button><button data-dir="down" aria-label="Move down">▼</button></div><button data-dir="right" aria-label="Move right">▶</button></div><button id="restart">↻ Restart</button></div><footer>A happy little game inspired by the cow-and-flower coding lesson 🌷</footer></main>
<script>
(()=>{
const canvas=document.getElementById('field'),c=canvas.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),message=document.getElementById('message');
const W=960,H=540,keys=new Set();let cow,flowers,particles,score,timeLeft,running,last=0,spawnTimer=0,clock=0,best=0;
try{best=Number(localStorage.getItem('cow-flower-best')||0)}catch(e){}bestEl.textContent=best;
function rand(a,b){return a+Math.random()*(b-a)}function reset(){cow={x:W/2,y:H/2+40,r:28,face:1};flowers=[];particles=[];score=0;timeLeft=45;running=true;spawnTimer=0;clock=0;for(let i=0;i<13;i++)spawn();scoreEl.textContent=0;timeEl.textContent=45;message.textContent='Grab as many as you can in 45 seconds.';last=performance.now()}function spawn(){let x,y,tries=0;do{x=rand(45,W-45);y=rand(175,H-37);tries++}while(Math.hypot(x-cow.x,y-cow.y)<78&&tries<20);flowers.push({x,y,r:15,color:['#f56aa3','#ffcf39','#8e75e9','#f48e43','#fff6fc'][Math.floor(rand(0,5))],phase:rand(0,6.28)})}
function ellipse(x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}function round(x,y,w,h,r,color){c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function background(t){c.fillStyle='#a6e4ff';c.fillRect(0,0,W,H);c.fillStyle='#fff8d2';c.beginPath();c.arc(785,80,49,0,Math.PI*2);c.fill();for(let i=0;i<5;i++){let x=((i*260+50-t*5)%(W+310))-120;ellipse(x,100+(i%2)*45,65,17,'#fff');ellipse(x+38,91+(i%2)*45,48,23,'#fff');ellipse(x-34,92+(i%2)*45,38,20,'#fff')}
c.fillStyle='#77c99c';c.beginPath();c.moveTo(0,205);c.quadraticCurveTo(250,125,505,210);c.quadraticCurveTo(730,130,960,185);c.lineTo(W,H);c.lineTo(0,H);c.fill();c.fillStyle='#6cba50';c.fillRect(0,250,W,H-250);for(let i=-4;i<18;i++){let x=i*95+15;c.fillStyle=i%2?'#7bc75b':'#83cc60';c.beginPath();c.moveTo(x,250);c.lineTo(x+48,250);c.lineTo(x+90,H);c.lineTo(x-8,H);c.fill()}c.fillStyle='#397b3c';for(let i=0;i<31;i++){let x=(i*127+43)%W,y=265+(i*83)%260;c.fillRect(x,y,3,12);c.fillRect(x-5,y+4,5,2);c.fillRect(x+3,y+7,5,2)}
// Fence
for(let i=0;i<11;i++){let x=25+i*94;round(x,205,9,48,2,'#bb8446')}round(18,211,940,7,2,'#ce9a59');round(18,232,940,7,2,'#ce9a59')}
function flower(f,t){let bob=Math.sin(t*2+f.phase)*2;let y=f.y+bob;c.strokeStyle='#2c823d';c.lineWidth=4;c.beginPath();c.moveTo(f.x,y+9);c.lineTo(f.x-2,y+30);c.stroke();ellipse(f.x-8,y+21,10,5,'#317f44');ellipse(f.x+7,y+24,9,5,'#439851');for(let i=0;i<6;i++){const a=i*Math.PI/3;ellipse(f.x+Math.cos(a)*11,y+Math.sin(a)*11,8,8,f.color)}ellipse(f.x,y,8,8,'#edaa31');ellipse(f.x-2,y-2,2,2,'#ffed8d')}
function drawCow(t){c.save();c.translate(cow.x,cow.y+Math.sin(t*9)*1.6);if(cow.face<0)c.scale(-1,1);ellipse(0,38,40,9,'#3d713a55');c.strokeStyle='#3b3129';c.lineWidth=6;for(const x of [-21,18]){c.beginPath();c.moveTo(x,22);c.lineTo(x,41);c.stroke()}ellipse(0,1,41,29,'#faf8ed');ellipse(-17,-6,15,17,'#3b332d');ellipse(18,12,13,11,'#3b332d');c.strokeStyle='#3b332d';c.lineWidth=5;c.beginPath();c.moveTo(-37,1);c.quadraticCurveTo(-59,-13,-52,-26);c.stroke();ellipse(-48,-25,6,6,'#3b332d');ellipse(24,-22,16,12,'#f7f5ea');ellipse(41,-21,13,9,'#f7f5ea');ellipse(30,-20,9,6,'#f2b7b4');ellipse(42,-19,7,5,'#f2b7b4');ellipse(32,-7,24,20,'#f9f6ef');ellipse(44,1,22,16,'#f3aba9');ellipse(34,1,4,4,'#9e626a');ellipse(49,2,4,4,'#9e626a');ellipse(32,-14,4,5,'#242725');ellipse(49,-14,4,5,'#242725');c.restore()}
function pop(x,y,color){for(let i=0;i<9;i++){let a=rand(0,Math.PI*2),s=rand(45,130);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-45,life:0.65,color})}}
function update(dt){if(!running)return;clock+=dt;timeLeft=Math.max(0,timeLeft-dt);timeEl.textContent=Math.ceil(timeLeft);let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up'));let m=Math.hypot(dx,dy)||1;cow.x=Math.max(37,Math.min(W-45,cow.x+dx/m*290*dt));cow.y=Math.max(175,Math.min(H-45,cow.y+dy/m*290*dt));if(dx!==0)cow.face=dx>0?1:-1;for(let i=flowers.length-1;i>=0;i--){let f=flowers[i];if(Math.hypot(f.x-cow.x,f.y-cow.y)<38){flowers.splice(i,1);score++;scoreEl.textContent=score;pop(f.x,f.y,f.color);spawn();if(score%5===0)message.textContent=['Moo-velous! 🎉','Amazing flower picking! 🌸','What a happy cow! 🐮'][Math.floor(score/5-1)%3]}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(timeLeft===0){running=false;message.textContent=`Time's up! You gathered ${score} flowers!`;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('cow-flower-best',best)}catch(e){}}}}
function draw(now){let dt=Math.min((now-last)/1000||0,0.04);last=now;update(dt);background(clock);for(const f of flowers)flower(f,clock);drawCow(clock);for(const p of particles){c.globalAlpha=Math.max(0,p.life/0.65);ellipse(p.x,p.y,5,5,p.color)}c.globalAlpha=1;if(!running){c.fillStyle='#0d3925aa';c.fillRect(0,0,W,H);round(W/2-270,H/2-100,540,200,23,'#fff8e6');c.textAlign='center';c.fillStyle='#226340';c.font='bold 51px system-ui';c.fillText('MOO-velous! 🐮',W/2,H/2-28);c.font='bold 27px system-ui';c.fillText(`You collected ${score} flowers!`,W/2,H/2+22);c.font='20px system-ui';c.fillText('Press Restart to play again',W/2,H/2+65)}requestAnimationFrame(draw)}
const keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};window.addEventListener('keydown',e=>{let dir=keyMap[e.key];if(dir){keys.add(dir);e.preventDefault()}if((e.key===' '||e.key==='Enter')&&!running)reset()});window.addEventListener('keyup',e=>{let dir=keyMap[e.key];if(dir)keys.delete(dir)});window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(b=>{let dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(dir)});for(let type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>keys.delete(dir))});document.getElementById('restart').addEventListener('click',reset);reset();requestAnimationFrame(draw);
})();
</script></body></html>
